<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f97316" />
  <meta name="color-scheme" content="light" />
  <title>WILLS AI COO</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="loginView" class="login-shell">
    <div class="login-card">
      <div class="brand-mark">AI</div>
      <p class="eyebrow">WILLS INTELLIGENCE</p>
      <h1>WILL — AI COO</h1>
      <p class="muted">Business Control Tower untuk Owner & Investor Wills.</p>
      <form id="loginForm" autocomplete="on">
        <label>Login ID<input id="loginId" autocomplete="username" placeholder="owner / investor" required /></label>
        <label>PIN<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" minlength="4" placeholder="••••••" required /></label>
        <button class="btn primary wide" type="submit">Masuk ke WILL</button>
      </form>
      <div id="demoHint" class="demo-hint hidden">Preview Demo aktif. Gunakan tombol Demo Owner / Demo Investor.</div>
      <div id="demoActions" class="demo-actions hidden">
        <button class="btn soft" data-demo="OWNER">Demo Owner</button>
        <button class="btn soft" data-demo="INVESTOR">Demo Investor</button>
      </div>
      <p class="security-note">READ → ANALYZE → PROPOSE. AI tidak mengeksekusi perubahan ledger, stok, atau kas.</p>
    </div>
  </section>

  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <div>
        <p class="eyebrow">WILLS AI COO</p>
        <h2 id="helloTitle">Good Morning</h2>
      </div>
      <button id="profileBtn" class="avatar" aria-label="Profil">OW</button>
    </header>

    <main id="mainContent" class="content">
      <section id="homePage" class="page active"></section>
      <section id="outletsPage" class="page"></section>
      <section id="alertsPage" class="page"></section>
      <section id="willPage" class="page"></section>
      <section id="morePage" class="page"></section>
      <section id="detailPage" class="page"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navigasi utama">
      <button data-page="homePage" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-page="outletsPage" class="nav-item"><span>▦</span><small>Outlet</small></button>
      <button data-page="alertsPage" class="nav-item"><span>!</span><small>Alert</small></button>
      <button data-page="willPage" class="nav-item will-nav"><span>W</span><small>WILL</small></button>
      <button data-page="morePage" class="nav-item"><span>☰</span><small>More</small></button>
    </nav>
  </div>

  <script src="config.js"></script>
  <script src="demo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
